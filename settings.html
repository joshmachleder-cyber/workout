<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<title>Settings</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--line:#2b3341;
    --text:#e6edf3;--dim:#8b949e;--accent:#f78166;--good:#3fb950;--blue:#58a6ff;--warn:#d29922;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);padding:0 0 96px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  h1{margin:0;font-size:26px;letter-spacing:-.5px}
  main{padding:16px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:24px 0 10px;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:9px}
  .m{color:var(--dim);font-size:13px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;
    padding:11px 2px;border-bottom:1px solid var(--line)}
  .toggle-row:last-child{border:0}
  .toggle-row .lbl2{font-weight:600;font-size:15px;text-transform:capitalize}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;cursor:pointer;transition:.15s}
  .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:2px;
    background:var(--dim);border-radius:50%;transition:.15s}
  input:checked + .slider{background:#1d3d24;border-color:var(--good)}
  input:checked + .slider::before{transform:translateX(20px);background:var(--good)}
  .exrow{display:flex;justify-content:space-between;align-items:center;
    padding:10px 2px;border-bottom:1px solid var(--line);gap:10px}
  .exrow:last-child{border:0}
  .exrow .n{font-size:14px}
  .exrow button{width:auto;padding:7px 12px;font-size:12px;margin:0}
  .empty{color:var(--dim);font-size:14px;padding:6px 2px}
  input[type=text],input[type=password]{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:11px;color:var(--text);font-size:15px;margin-top:6px
  }
  .lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;
    margin:14px 0 4px;font-weight:700}
  button{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:15px;font-weight:650;
    cursor:pointer;margin-top:9px}
  button.primary{background:var(--accent);border:0;color:#1a0d08}
  .status{font-size:13px;color:var(--dim);margin-top:10px}
  .status.err{color:#f85149}
  .status.ok{color:var(--good)}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom)}
  nav a{flex:1;text-align:center;padding:13px 0;color:var(--dim);
    text-decoration:none;font-size:12px;font-weight:650}
  nav a.on{color:var(--accent)}
</style>
</head>
<body>

<header><h1>Settings</h1></header>
<main id="app"></main>

<nav>
  <a href="index.html">Today</a>
  <a href="history.html">History</a>
  <a href="settings.html" class="on">Settings</a>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const EQUIPMENT_TYPES = ['barbell','dumbbells','cables','machine','bands','ez-bar','bodyweight'];
let STATE;

function allExercises(){
  return Object.keys(window.EXERCISES)
    .filter(k => Array.isArray(window.EXERCISES[k]))
    .flatMap(k => window.EXERCISES[k]);
}

function exName(id){
  const hit = allExercises().find(e => e.id === id);
  return hit ? hit.name : id;
}

function boot(){
  STATE = WorkoutEngine.loadState();
  STATE.equipment = STATE.equipment || {barbell:true,dumbbells:true,cables:true,machine:true,bands:true,'ez-bar':true,bodyweight:true};
  STATE.preferences = STATE.preferences || {favorites:[],avoided:[]};
  render();
}

function render(){
  const cfg = WorkoutEngine.loadGistConfig();
  const avoided = STATE.preferences.avoided;
  const favorites = STATE.preferences.favorites;

  document.getElementById('app').innerHTML = `
    <h2>Equipment available today</h2>
    <div class="card">
      <div class="m" style="margin-bottom:8px">Turn off anything you can't access. The generator shrinks a block rather than picking something you don't have.</div>
      ${EQUIPMENT_TYPES.map(t => `
        <div class="toggle-row">
          <div class="lbl2">${t.replace('-',' ')}</div>
          <label class="switch">
            <input type="checkbox" data-equip="${t}" ${STATE.equipment[t] !== false ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>`).join('')}
    </div>

    <h2>Avoided exercises</h2>
    <div class="card">
      ${avoided.length ? avoided.map(id => `
        <div class="exrow">
          <div class="n">${exName(id)}</div>
          <button data-unavoid="${id}">Undo</button>
        </div>`).join('') : '<div class="empty">Nothing avoided. Tap 🚫 on any exercise card to keep it out of rotation.</div>'}
    </div>

    <h2>Favorited exercises</h2>
    <div class="card">
      ${favorites.length ? favorites.map(id => `
        <div class="exrow">
          <div class="n">${exName(id)}</div>
          <button data-unfav="${id}">Remove</button>
        </div>`).join('') : '<div class="empty">Nothing favorited yet. Tap ♥ on any exercise card to surface it more often.</div>'}
    </div>

    <h2>Sync between devices</h2>
    <div class="card">
      <div class="m">Stores your history in a private GitHub Gist you own. The token stays only in this browser's storage and is never included in history exports.</div>
      <div class="lbl">GitHub token (gist scope)</div>
      <input type="password" id="token" placeholder="ghp_..." value="${cfg.token || ''}">
      <div class="lbl">Gist ID (leave blank to create one on first push)</div>
      <input type="text" id="gistId" placeholder="auto-filled after first push" value="${cfg.gistId || ''}">
      <button class="primary" id="pushBtn">Push history to gist</button>
      <button id="pullBtn">Pull history from gist</button>
      <div class="status" id="syncStatus">${cfg.lastSync ? 'Last synced ' + new Date(cfg.lastSync).toLocaleString() : 'Never synced.'}</div>
    </div>`;

  bind();
}

function bind(){
  document.querySelectorAll('[data-equip]').forEach(cb=>{
    cb.onchange = ()=>{
      WorkoutEngine.setEquipment(STATE, cb.dataset.equip, cb.checked);
    };
  });
  document.querySelectorAll('[data-unavoid]').forEach(btn=>{
    btn.onclick = ()=>{
      WorkoutEngine.toggleAvoided(STATE, btn.dataset.unavoid);
      render();
    };
  });
  document.querySelectorAll('[data-unfav]').forEach(btn=>{
    btn.onclick = ()=>{
      WorkoutEngine.toggleFavorite(STATE, btn.dataset.unfav);
      render();
    };
  });

  document.getElementById('pushBtn').onclick = async ()=>{
    const status = document.getElementById('syncStatus');
    const cfg = WorkoutEngine.loadGistConfig();
    cfg.token = document.getElementById('token').value.trim();
    cfg.gistId = document.getElementById('gistId').value.trim();
    WorkoutEngine.saveGistConfig(cfg);
    status.className = 'status';
    status.textContent = 'Pushing...';
    try {
      const result = await WorkoutEngine.pushToGist(WorkoutEngine.loadState());
      status.className = 'status ok';
      status.textContent = 'Pushed. Gist ID: ' + result.gistId;
      document.getElementById('gistId').value = result.gistId;
    } catch(e){
      status.className = 'status err';
      status.textContent = e.message;
    }
  };

  document.getElementById('pullBtn').onclick = async ()=>{
    const status = document.getElementById('syncStatus');
    const cfg = WorkoutEngine.loadGistConfig();
    cfg.token = document.getElementById('token').value.trim();
    cfg.gistId = document.getElementById('gistId').value.trim();
    WorkoutEngine.saveGistConfig(cfg);
    if(!confirm('This replaces everything currently stored on this device. Continue?')) return;
    status.className = 'status';
    status.textContent = 'Pulling...';
    try {
      await WorkoutEngine.pullFromGist();
      status.className = 'status ok';
      status.textContent = 'Pulled. Reloading...';
      setTimeout(()=>location.reload(), 600);
    } catch(e){
      status.className = 'status err';
      status.textContent = e.message;
    }
  };
}

if(typeof window.EXERCISES === 'undefined' || typeof window.WorkoutEngine === 'undefined'){
  document.getElementById('app').innerHTML = '<div class="card">data.js or app.js is missing. Upload them alongside index.html.</div>';
} else {
  boot();
}
</script>
</body>
</html>
