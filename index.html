<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout</title>
<style>
  :root{
    --bg:#0c0e12; --panel:#151920; --panel2:#1c222b; --line:#2a323e;
    --txt:#e8edf4; --dim:#8b97a8;
    --legs:#4ade80; --chest:#f87171; --arms:#38bdf8;
    --warn:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:18px 14px 40px;line-height:1.45;max-width:620px;margin:0 auto}
  h1{font-size:24px;margin:0 0 3px;letter-spacing:-.4px}
  .today{color:var(--dim);font-size:13px;margin-bottom:20px}

  .last{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:8px;border-left:3px solid var(--line)}
  .last.legs{border-left-color:var(--legs)}
  .last.chest{border-left-color:var(--chest)}
  .last.arms{border-left-color:var(--arms)}
  .lastlabel{font-size:11.5px;color:var(--dim);margin-bottom:7px}
  .lastday{font-size:20px;font-weight:600;letter-spacing:-.3px}
  .lastday .when{font-size:13px;font-weight:400;color:var(--dim);margin-left:8px}
  .lastsets{font-size:13px;color:var(--dim);margin-top:6px}
  .lastsets b{color:var(--txt);font-weight:600}
  .bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:11px}
  .fill{height:100%;width:0;background:var(--dim)}
  .last.legs .fill{background:var(--legs)}
  .last.chest .fill{background:var(--chest)}
  .last.arms .fill{background:var(--arms)}
  .wlist{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--dim);display:none}
  .wlist.show{display:block}
  .wrow{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px}
  .wrow span:first-child{color:#b9c4d2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow span:last-child{flex-shrink:0}
  .toggle{background:none;border:none;color:var(--dim);font-size:12px;
    padding:9px 0 0;cursor:pointer;font-family:inherit}
  .toggle:hover{color:var(--txt)}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;
    padding:18px 16px;margin-bottom:8px;font-size:13.5px;color:var(--dim)}
  .empty b{color:var(--txt);font-weight:600}

  .ask{font-size:15px;font-weight:600;margin:26px 0 11px;letter-spacing:-.2px}
  .days{display:flex;flex-direction:column;gap:9px}
  a.day{display:flex;align-items:center;gap:13px;text-decoration:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;color:var(--txt);transition:border-color .15s,background .15s}
  a.day:hover,a.day:focus-visible{background:var(--panel2)}
  a.day:focus-visible{outline:2px solid var(--arms);outline-offset:2px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .day.legs .dot{background:var(--legs)} .day.legs:hover{border-color:var(--legs)}
  .day.chest .dot{background:var(--chest)} .day.chest:hover{border-color:var(--chest)}
  .day.arms .dot{background:var(--arms)} .day.arms:hover{border-color:var(--arms)}
  .dname{font-size:16px;font-weight:600;letter-spacing:-.2px;flex:1}
  .up{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--bg);
    background:var(--dim);border-radius:5px;padding:3px 7px}
  .day.legs .up{background:var(--legs)}
  .day.chest .up{background:var(--chest)}
  .day.arms .up{background:var(--arms)}
  .ago{font-size:12px;color:var(--dim);flex-shrink:0}

  .hist{margin-top:30px}
  .histhead{font-size:12px;color:var(--dim);margin-bottom:9px}
  .hrow{display:flex;align-items:center;gap:11px;font-size:13px;
    padding:8px 0;border-top:1px solid var(--line);color:var(--dim)}
  .hrow b{color:var(--txt);font-weight:600;min-width:52px}
  .hrow .hsets{margin-left:auto}
  .clear{background:none;border:none;color:#4a5566;font-size:11.5px;
    margin-top:22px;padding:0;cursor:pointer;font-family:inherit}
  .clear:hover{color:var(--dim)}
</style>
</head>
<body>

<h1>Workout</h1>
<div class="today" id="today"></div>

<div id="lastwrap"></div>

<div class="ask">What are you training today?</div>
<div class="days" id="days"></div>

<div class="hist" id="hist"></div>

<button class="clear" id="clear">Clear saved history</button>

<script>
(function(){
  var KEY = 'workoutHistory';
  var DAYS = [
    {id:'legs',  name:'Legs',  file:'legs.html'},
    {id:'chest', name:'Chest', file:'chest.html'},
    {id:'arms',  name:'Arms',  file:'arms.html'}
  ];
  var ORDER = ['legs','chest','arms'];

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
  }
  function fmt(iso){
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  function daysAgo(iso){
    var p = iso.split('-');
    var then = new Date(+p[0], +p[1]-1, +p[2]);
    var now = new Date(); now.setHours(0,0,0,0);
    var n = Math.round((now - then)/86400000);
    if(n <= 0) return 'today';
    if(n === 1) return 'yesterday';
    return n + ' days ago';
  }

  var hist = load().slice().sort(function(a,b){ return (a.updated||0) - (b.updated||0); });
  var last = hist[hist.length-1] || null;

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

  // Last session
  var wrap = document.getElementById('lastwrap');
  if(last){
    var pct = last.total ? Math.round(last.done/last.total*100) : 0;
    var rows = (last.weights||[]).map(function(w){
      return '<div class="wrow"><span>'+esc(w.name)+'</span><span>'+esc(w.w.join(', '))+'</span></div>';
    }).join('');
    wrap.innerHTML =
      '<div class="last '+last.day.toLowerCase()+'">'+
        '<div class="lastlabel">Last session</div>'+
        '<div class="lastday">'+esc(last.day)+' Day<span class="when">'+fmt(last.date)+', '+daysAgo(last.date)+'</span></div>'+
        '<div class="lastsets"><b>'+last.done+'</b> of '+last.total+' sets completed</div>'+
        '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+
        (rows ? '<button class="toggle" id="tg">Show the weights you logged</button><div class="wlist" id="wl">'+rows+'</div>' : '')+
      '</div>';
    var tg = document.getElementById('tg');
    if(tg) tg.addEventListener('click', function(){
      var wl = document.getElementById('wl');
      wl.classList.toggle('show');
      tg.textContent = wl.classList.contains('show') ? 'Hide the weights you logged' : 'Show the weights you logged';
    });
  } else {
    wrap.innerHTML = '<div class="empty">No sessions saved yet. <b>Pick a day below and start tapping sets.</b> This screen fills in from the next workout onward.</div>';
  }

  // Suggested next day, following legs then chest then arms
  var nextId = last ? ORDER[(ORDER.indexOf(last.day.toLowerCase())+1) % 3] : 'legs';

  var lastByDay = {};
  hist.forEach(function(h){ lastByDay[h.day.toLowerCase()] = h.date; });

  document.getElementById('days').innerHTML = DAYS.map(function(d){
    var tail = d.id === nextId
      ? '<span class="up">NEXT UP</span>'
      : (lastByDay[d.id] ? '<span class="ago">'+daysAgo(lastByDay[d.id])+'</span>' : '');
    return '<a class="day '+d.id+'" href="'+d.file+'"><span class="dot"></span>'+
           '<span class="dname">'+d.name+'</span>'+tail+'</a>';
  }).join('');

  // Recent sessions
  var recent = hist.slice(-6).reverse();
  if(recent.length > 1){
    document.getElementById('hist').innerHTML =
      '<div class="histhead">Recent sessions</div>'+
      recent.map(function(h){
        return '<div class="hrow"><b>'+esc(h.day)+'</b> '+fmt(h.date)+
               '<span class="hsets">'+h.done+'/'+h.total+' sets</span></div>';
      }).join('');
  }

  document.getElementById('clear').addEventListener('click', function(){
    if(confirm('Clear all saved session history on this device?')){
      localStorage.removeItem(KEY);
      location.reload();
    }
  });

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
})();
</script>
</body>
</html>
